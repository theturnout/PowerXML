name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validation:
    name: Validate tagged release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish validated release
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Download validated module
        uses: actions/download-artifact@v4
        with:
          name: powerxml
          path: out

      - name: Publish PowerShell Module to Gallery
        uses: natescherer/publish-powershell-action@v1
        with:
          token: ${{ secrets.PSGALLERY }}
          target: gallery
          path: out

      - name: Publish PowerShell Module to GitHub
        uses: natescherer/publish-powershell-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: github
          path: out
